name: Claude review

# Revisor automático: Claude Code lee el diff de cada PR y publica sus hallazgos
# como comentarios en el PR (en línea sobre el código y uno general). Pasos
# manuales pendientes, coste y credenciales: docs/ci-revisor.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Sin permisos por defecto para ningún job del workflow.
permissions: {}

# Un push nuevo al mismo PR cancela la revisión anterior: no se paga dos veces.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Los PR desde un fork no reciben secretos (ver docs/ci-revisor.md): el job
    # se salta en vez de fallar en la primera llamada sin credencial.
    # Los borradores no se revisan hasta que salen de borrador (cada push costaría
    # una revisión). Dependabot tampoco: GitHub le da su propio almacén de
    # secretos, no el de Actions, y el job fallaría siempre sin credencial.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # clonar el repo y leer el código
      pull-requests: write # publicar los comentarios en el PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # La cabeza del PR, no el merge con la base: así las líneas que lee
          # Read coinciden con las del diff donde ancla los comentarios.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          # Credencial: token de suscripción generado con `claude setup-token`.
          # Para usar en su lugar una clave de API de la consola, cambia esta
          # línea por `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`.
          # No son intercambiables: ver docs/ci-revisor.md.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # El GITHUB_TOKEN del job, limitado a los permisos de arriba. Evita
          # instalar la GitHub App de Claude y pedir `id-token: write`.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allow_fork_prs: "false"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revisa este pull request. La rama del PR ya está en el directorio de trabajo.

            1. Lee `REVIEW.md`, en la raíz del repositorio, antes que nada con la
               herramienta Read, y cúmplelo: define qué cuenta como grave, el tope de
               sugerencias, dónde no reportar y qué evidencia exige cada afirmación.
            2. Obtén el diff con `gh pr diff ${{ github.event.pull_request.number }}` y
               abre los ficheros que necesites con Read, Grep y Glob.
            3. No redirijas salida a ficheros (nada de `>`, `>>`, `tee` ni ficheros
               temporales): lee directamente la salida de cada comando.
            4. Publica cada hallazgo como comentario en línea con
               `mcp__github_inline_comment__create_inline_comment` (con `confirmed: true`),
               anclado al fichero y la línea del diff, con severidad y escenario de fallo.
            5. Cierra con un único `gh pr comment` que resuma los hallazgos, o diga que no
               hay ninguno. Escribe los comentarios en castellano.

            Publica solo comentarios en GitHub: no dejes la revisión únicamente como
            texto de la ejecución. No modifiques ficheros ni hagas commits.
          claude_args: |
            --model sonnet
            --effort medium
            --max-turns 40
            --permission-mode default
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff ${{ github.event.pull_request.number }}:*),Bash(gh pr view ${{ github.event.pull_request.number }}:*),Bash(gh pr comment ${{ github.event.pull_request.number }}:*)"
